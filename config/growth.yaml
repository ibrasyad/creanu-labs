# =============================================================================
# GROWTH MODEL CONFIGURATION
# =============================================================================
# Multipliers for user acquisition, visit frequency, and conversion rates
# - new_user: User acquisition growth
# - visit: Visit frequency/engagement
# - conversion: Conversion rate improvements
# =============================================================================

growth:
  # ==================== BASE GROWTH PROFILES ====================
  # Default growth rates applied to tiers based on their profile metadata
  
  base:
    # Default multipliers for all tiers
    overall:
      new_user:  1.0   # Baseline acquisition
      visit:     1.0   # Baseline engagement
      # conversion: 1.0  # Baseline conversion

    # Profile-specific growth patterns
    tier_profiles:
      conservative:  # Budget-conscious tiers
        new_user:  0.9   # Slow, steady acquisition
        visit:     1.0   # Consistent engagement
        # conversion: 1.0  # Stable conversion
        
      aggressive:   # Growth-focused tiers  
        new_user:  1.1   # +10% faster acquisition
        visit:     1.1   # +10% higher engagement
        # conversion: 1.1  # +10% better conversion
        
      balanced:     # Steady, reliable tiers
        new_user:  1.0   # 0% moderate acquisition
        visit:     1.05  # +5% engagement
        # conversion: 1.05  # +5% conversion

  # ==================== YEARLY GROWTH STRATEGIES ====================
  
  yearly:
    # --------------------
    # YEAR 1 — Launch & Land Grab
    # --------------------
    year_1:
      overall:
        new_user:  1.35  # +35% aggressive acquisition
        visit:     0.85  # -15% lower engagement (focus on acquisition)
        # conversion: 1.00  # Neutral conversion
        
      # Profile-based growth multipliers
      profile_multipliers:
        conservative:
          new_user:  1.45  # +45% strong acquisition
          visit:     1.20  # +20% good engagement
          # conversion: 0.95  # -5% slight conversion dip
          
        aggressive:
          new_user:  1.20  # +20% moderate acquisition
          visit:     1.15  # +15% engagement
          # conversion: 1.10  # +10% conversion
          
        balanced:
          new_user:  1.15  # +15% steady acquisition
          visit:     1.10  # +10% engagement
          # conversion: 1.05  # +5% conversion

    # --------------------
    # YEAR 2 — Learning & Efficiency
    # --------------------
    year_2:
      overall:
        new_user:  1.30  # +30% continued acquisition
        visit:     0.85  # -15% still optimizing
        # conversion: 0.75  # -25% conversion challenges
        
      profile_multipliers:
        conservative:
          new_user:  1.15  # +15% saturation begins
          visit:     1.15  # +15% promo-heavy engagement
          # conversion: 1.15  # +15% improving conversion
          
        aggressive:
          new_user:  1.25  # +25% strong acquisition
          visit:     1.15  # +15% high engagement
          # conversion: 1.15  # +15% best conversion
          
        balanced:
          new_user:  1.10  # +10% moderate acquisition
          visit:     1.15  # +15% engagement
          # conversion: 1.10  # +10% conversion

    # --------------------
    # YEAR 3 — Strategic Shift: Premium Push
    # --------------------
    year_3:
      overall:
        new_user:  0.95  # -5% deprioritize acquisition
        visit:     1.05  # +5% focus on existing users (reduced from +15%)
        # conversion: 1.05  # +5% conversion improvements (reduced from +10%)
        
      profile_multipliers:
        conservative:
          new_user:  0.75  # -25% acquisition deprioritized
          visit:     1.05  # +5% existing users active (reduced from +10%)
          # conversion: 1.10  # +15% conversion focus
          
        aggressive:
          new_user:  1.05  # +5% still acquiring (reduced from +10%)
          visit:     1.05  # +5% engagement (reduced from +10%)
          # conversion: 1.03  # +3% premium conversion (reduced from +5%)
          
        balanced:
          new_user:  1.03  # +3% moderate acquisition (reduced from +5%)
          visit:     1.03  # +3% engagement (reduced from +7%)
          # conversion: 1.03  # +3% conversion (reduced from +7%)

    # --------------------
    # YEAR 4 — Correction & Rebalance
    # --------------------
    year_4:
      overall:
        new_user:  1.10  # +10% renewed acquisition
        visit:     1.20  # +20% peak engagement
        # conversion: 1.15  # +15% strong conversion
        
      profile_multipliers:
        conservative:
          new_user:  1.00  # 0% stable acquisition
          visit:     1.10  # +10% engagement
          # conversion: 1.10  # +10% conversion
          
        aggressive:
          new_user:  1.20  # +20% strong acquisition
          visit:     1.15  # +15% engagement
          # conversion: 1.15  # +15% conversion
          
        balanced:
          new_user:  1.05  # +5% moderate acquisition
          visit:     1.05  # +5% engagement
          # conversion: 1.05  # +5% conversion

    # --------------------
    # YEAR 5 — Market Saturation
    # --------------------
    year_5:
      overall:
        new_user:  0.85  # -15% acquisition slowdown
        visit:     1.15  # +15% stable engagement
        # conversion: 1.00  # 0% stable conversion
        
      profile_multipliers:
        conservative:
          new_user:  0.85  # -15% acquisition decline
          visit:     1.00  # 0% stable engagement
          # conversion: 1.05  # +5% slight conversion
          
        aggressive:
          new_user:  1.05  # +5% minimal acquisition
          visit:     1.05  # +5% engagement
          # conversion: 1.10  # +10% conversion
          
        balanced:
          new_user:  0.95  # -5% acquisition decline
          visit:     0.95  # -5% engagement decline
          # conversion: 1.00  # 0% stable conversion

    # --------------------
    # YEAR 6 — Efficiency Mode
    # --------------------
    year_6:
      overall:
        new_user:  0.95  # -5% minimal acquisition
        visit:     1.35  # +35% efficiency focus
        # conversion: 1.05  # +5% conversion optimization
        
      profile_multipliers:
        conservative:
          new_user:  0.80  # -20% acquisition decline
          visit:     0.95  # -5% engagement decline
          # conversion: 1.05  # +5% conversion
          
        aggressive:
          new_user:  0.95  # -5% minimal acquisition
          visit:     1.05  # +5% engagement
          # conversion: 1.10  # +10% conversion
          
        balanced:
          new_user:  0.85  # -15% acquisition decline
          visit:     0.90  # -10% engagement decline
          # conversion: 1.00  # 0% stable conversion

    # --------------------
    # YEAR 7 — Mature Product
    # --------------------
    year_7:
      overall:
        new_user:  0.85  # -15% acquisition decline
        visit:     1.25  # +25% engagement focus
        # conversion: 1.00  # 0% stable conversion
        
      profile_multipliers:
        conservative:
          new_user:  0.75  # -25% acquisition decline
          visit:     0.90  # -10% engagement decline
          # conversion: 1.00  # 0% stable conversion
          
        aggressive:
          new_user:  0.90  # -10% acquisition decline
          visit:     0.95  # -5% engagement decline
          # conversion: 1.05  # +5% conversion
          
        balanced:
          new_user:  0.80  # -20% acquisition decline
          visit:     0.80  # -20% engagement decline
          # conversion: 0.95  # -5% conversion decline

    # --------------------
    # YEAR 8+ — Long-term Steady State
    # --------------------
    year_8_plus:
      overall:
        new_user:  0.95  # -5% minimal acquisition
        visit:     1.35  # +35% engagement maintenance
        # conversion: 1.00  # 0% stable conversion
        
      profile_multipliers:
        conservative:
          new_user:  0.70  # -30% low acquisition
          visit:     0.85  # -15% lower engagement
          # conversion: 1.00  # 0% stable conversion
          
        aggressive:
          new_user:  0.85  # -15% minimal acquisition
          visit:     0.90  # -10% engagement
          # conversion: 1.05  # +5% conversion
          
        balanced:
          new_user:  0.75  # -25% low acquisition
          visit:     0.75  # -25% lower engagement
          # conversion: 0.90  # -10% conversion decline
