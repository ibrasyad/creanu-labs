# =============================================================================
# DATE RANGE & TRANSACTION VOLUME CONFIGURATION
# =============================================================================

date:
  # ==================== SIMULATION PERIOD ====================
  # Date range for the entire simulation
  start_date: "2023-01-01"
  end_date:   "2025-12-31"

  # ==================== TRANSACTION VOLUME ====================
  transaction_volume:
    # --------------------
    # Monthly Volume Multipliers
    # --------------------
    # Multiplier for transaction volume by month (1.0 = baseline)
    monthly_rate:
      january:   0.8   # New year, normal activity
      february:  0.8   # Shorter month, slightly lower
      march:     1.1   # Spring shopping begins
      april:     0.8   # Stable month
      may:       1.1   # Pre-summer shopping
      june:      1.0   # Summer begins
      july:      1.2   # Peak summer, vacation shopping
      august:    1.1   # End of summer
      september: 0.9   # Back to school, stable
      october:   1.0   # Fall season
      november:  1.2   # Holiday prep begins
      december:  1.4   # Holiday shopping peak

    # Random variation applied to monthly rates
    monthly_rate_noise:
      distribution: poisson
      multiplier: 1.25

    # --------------------
    # Daily Transaction Patterns
    # --------------------
    # Expected transactions per day by weekday
    weekday_base:
      monday:    45   # Start of week
      tuesday:   55   # Lower activity
      wednesday: 60   # Mid-week
      thursday:  50   # Lowest activity
      friday:    70   # Pre-weekend shopping
      saturday:  90   # Weekend peak
      sunday:    85   # Weekend shopping

    # Random variation applied to daily transaction counts
    weekday_rate_noise:
      distribution: poisson
      multiplier: 1.15