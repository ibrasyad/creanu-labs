# Customer tier configurations - defines shopping behavior by customer segment
tiers:

  # Price-sensitive, smaller baskets
  budget:
    # Minimum and maximum items per transaction
    basket:
      min_items: 1
      max_items: 4

    # Relative preference for each category (higher = more likely)
    category_weight:
      vegetables: 1.2
      fruits: 0.6
      grains: 1.1
      dairy: 0.5
      bakery: 0.3
      snacks: 0.4
      beverages: 0.2
      meat: 0.1
      seafood: 0.1
      poultry: 1.0
      frozen_foods: 0.7
      personal_care: 0.1
      household_supplies: 0.3
      condiments_seasonings: 0.4
    
    # Average units per item (Poisson distribution)
    quantity_model:
      base_lambda: 1.5
    
    # Multiplier for quantity per category: actual_avg = base_lambda * bias
    # E.g., vegetables: 1.5 * 1.2 = 1.8 avg units per item
    quantity_bias:
      vegetables: 1.3
      fruits: 0.5
      grains: 0.1
      dairy: 0.5
      bakery: 0.3
      snacks: 0.4
      beverages: 0.2
      meat: 0.1
      seafood: 0.1
      poultry: 1.2
      frozen_foods: 0.7
      personal_care: 0.1
      household_supplies: 0.3
      condiments_seasonings: 0.4

    # Override default duplicate rules for specific subcategories (optional)
    # If not specified, uses simulation.yaml defaults
    # subcategory_allow_duplicates:
    #   grains: false
    #   rice: false

    # price_sensitivity:
    #   max_multiplier: 1.05
    
    # Likelihood of this tier being selected per weekday (higher = more likely)
    transaction_weight:
      monday: 10
      tuesday: 10
      wednesday: 10
      thursday: 10
      friday: 10
      saturday: 10
      sunday: 10


  # Regular customers, medium-sized baskets
  random_tier:
    # Minimum and maximum items per transaction
    basket:
      min_items: 2
      max_items: 4

    # Balanced preference across all categories
    category_weight:
      vegetables: 1.0
      fruits: 1.0
      grains: 1.0
      dairy: 1.0
      bakery: 1.0
      snacks: 1.0
      beverages: 1.0
      meat: 1.0
      seafood: 1.0
      poultry: 1.0
      frozen_foods: 1.0
      personal_care: 1.0
      household_supplies: 1.0
      condiments_seasonings: 1.0
    
    # Average units per item (Poisson distribution)
    quantity_model:
      base_lambda: 1.5
    
    # Multiplier for quantity per category: actual_avg = base_lambda * bias
    # E.g., vegetables: 1.5 * 1.0 = 1.5 avg units per item (no modifier)
    quantity_bias:
      vegetables: 1.0
      fruits: 1.0
      grains: 1.0
      dairy: 1.0
      bakery: 1.0
      snacks: 1.0
      beverages: 1.0
      meat: 1.0
      seafood: 1.0
      poultry: 1.0
      frozen_foods: 1.0
      personal_care: 1.0
      household_supplies: 1.0
      condiments_seasonings: 1.0

    # Override default duplicate rules for specific subcategories (optional)
    # If not specified, uses simulation.yaml defaults
    # subcategory_allow_duplicates:
    #   grains: false
    #   rice: false

    # price_sensitivity:
    #   max_multiplier: 1.15
    
    # Equal weight across all days
    transaction_weight:
      monday: 10
      tuesday: 10
      wednesday: 10
      thursday: 10
      friday: 10
      saturday: 10
      sunday: 10


  # Premium customers, larger baskets, prefer snacks & beverages
  premium:
    # Minimum and maximum items per transaction
    basket:
      min_items: 4
      max_items: 10

    # Preference patterns - higher for snacks and beverages
