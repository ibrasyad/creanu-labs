    #   grains: false
    #   rice: false
    
    # price_sensitivity:
    #   max_multiplier: 1.15
    
    # Lower weekday presence, higher weekend shopping
    transaction_weight:
      monday: 7
      tuesday: 7
      wednesday: 7
      thursday: 7
      friday: 7
      saturday: 30
      sunday: 30


