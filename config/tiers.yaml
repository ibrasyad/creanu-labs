      snacks: 1.0
      beverages: 1.0
      meat: 1.0
      seafood: 1.0
      poultry: 1.0
      frozen_foods: 1.0
      personal_care: 1.0
      household_supplies: 1.0
      condiments_seasonings: 1.0
    
    # Average units per item (Poisson distribution)
    quantity_model:
      base_lambda: 1.5
    
    # Multiplier for quantity per category: actual_avg = base_lambda * bias
    # E.g., snacks: 1.5 * 1.2 = 1.8 avg units per item
    quantity_bias:
      vegetables: 1.0
      fruits: 1.0
      grains: 1.0
      dairy: 1.0
      bakery: 1.0
      snacks: 1.0
      beverages: 1.0
      meat: 1.0
      seafood: 1.0
      poultry: 1.0
      frozen_foods: 1.0
      personal_care: 1.0
      household_supplies: 1.0
      condiments_seasonings: 1.0

    # Override default duplicate rules for specific subcategories (optional)
    # If not specified, uses simulation.yaml defaults
