      snacks: 1.0
      beverages: 1.0
      meat: 1.0
      seafood: 1.0
      poultry: 1.0
      frozen_foods: 1.0
      personal_care: 1.0
      household_supplies: 1.0
      condiments_seasonings: 1.0

    # Override default duplicate rules for specific subcategories (optional)
    # If not specified, uses simulation.yaml defaults
    # subcategory_allow_duplicates:
    #   grains: false
    #   rice: false
    
    # price_sensitivity:
    #   max_multiplier: 1.15
    
    # Lower weekday presence, higher weekend shopping
    transaction_weight:
      monday: 7
      tuesday: 7
      wednesday: 7
      thursday: 7
      friday: 7
      saturday: 30
      sunday: 30


