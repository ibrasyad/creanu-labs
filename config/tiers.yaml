# Customer tier configurations - defines shopping behavior by customer segment
tiers:

  # Price-sensitive, smaller baskets
  budget:
    # Minimum and maximum items per transaction
    basket:
      min_items: 1
      max_items: 4

    # Relative preference for each category (higher = more likely)
    category_weight:
      vegetables: 1.2
      fruits: 1.0
      snacks: 0.4
      beverages: 0.6
    
    # Average units per item (Poisson distribution)
    quantity_model:
      base_lambda: 1.5
    
    # Multiplier for quantity per category (modifies base_lambda)
    quantity_bias:
      vegetables: 1.1
      fruits: 1.0
      snacks: 0.8
      beverages: 0.9

    # price_sensitivity:
    #   max_multiplier: 1.05
    
    # Likelihood of this tier being selected per weekday (higher = more likely)
    transaction_weight:
      monday: 10
      tuesday: 10
      wednesday: 10
      thursday: 10
      friday: 10
      saturday: 10
      sunday: 10


  # Regular customers, medium-sized baskets
  standard:
    # Minimum and maximum items per transaction
    basket:
      min_items: 2
      max_items: 6

    # Balanced preference across all categories
    category_weight:
      vegetables: 1.0
      fruits: 1.0
      snacks: 1.0
      beverages: 1.0
    
    # Average units per item (Poisson distribution)
    quantity_model:
      base_lambda: 1.5
    
    # No modifier - neutral purchasing behavior
    quantity_bias:
      vegetables: 1.0
      fruits: 1.0
      snacks: 1.0
      beverages: 1.0

    # price_sensitivity:
    #   max_multiplier: 1.15
    
    # Equal weight across all days
    transaction_weight:
      monday: 10
      tuesday: 10
      wednesday: 10
      thursday: 10
      friday: 10
      saturday: 10
      sunday: 10


  # Premium customers, larger baskets, prefer snacks & beverages
  premium:
    # Minimum and maximum items per transaction
    basket:
      min_items: 4
      max_items: 10

    # Preference patterns - higher for snacks and beverages
    category_weight:
      vegetables: 0.8
      fruits: 1.2
      snacks: 1.4
      beverages: 1.3
    
    # Average units per item (Poisson distribution)
    quantity_model:
      base_lambda: 1.5
    
    # Buy more of premium items
    quantity_bias:
      vegetables: 0.9
      fruits: 1.1
      snacks: 1.2
      beverages: 1.1

    # price_sensitivity:
    #   max_multiplier: 1.4
    
    # Lower weekday presence, higher weekend shopping
    transaction_weight:
      monday: 7
      tuesday: 7
      wednesday: 7
      thursday: 7
      friday: 7
      saturday: 30
      sunday: 30
