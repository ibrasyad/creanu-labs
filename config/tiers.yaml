# Customer tier configurations - defines shopping behavior by customer segment
tiers:

  # Regular customers, medium-sized baskets
  random_tier:
    # User demographic
    base_user: 10

    # Defines chance of new users everyday being created in this tier. Basic formula: chance per day * days in month
    daily_retry: 7
    daily_new_user_chance: 0.14
    daily_new_user_chance_weekend: 0.21

    daily_new_user_noise:
      distribution: poisson
      multiplier: 1.15
    
    # Defines new users multiplier by month name. E.g., january: 1.2 means 20% more new users in January. This is before the noise is applied.
    monthly_new_user_multiplier:
      january: 1.0
      february: 1.0
      march: 1.0
      april: 1.0
      may: 1.0
      june: 1.0
      july: 1.0
      august: 1.0
      september: 1.0
      october: 1.0
      november: 1.0
      december: 1.0

    monthly_new_user_noise:
      distribution: poisson
      multiplier: 1.25
    
    # Minimum and maximum items per transaction
    basket:
      min_items: 1
      max_items: 4

    # Balanced preference across all categories
    category_weight:
      vegetables: 1.0
      fruits: 1.0
      grains: 1.0
      dairy: 1.0
      bakery: 1.0
      snacks: 1.0
      beverages: 1.0
      meat: 1.0
      seafood: 1.0
      poultry: 1.0
      frozen_foods: 1.0
      personal_care: 1.0
      household_supplies: 1.0
      condiments_seasonings: 1.0
    
    # Average units per item (Poisson distribution)
    quantity_model:
      base_lambda: 1.5
    
    # Multiplier for quantity per category: actual_avg = base_lambda * bias
    # E.g., vegetables: 1.5 * 1.0 = 1.5 avg units per item (no modifier)
    quantity_bias:
      vegetables: 1.0
      fruits: 1.0
      grains: 1.0
      dairy: 1.0
      bakery: 1.0
      snacks: 1.0
      beverages: 1.0
      meat: 1.0
      seafood: 1.0
      poultry: 1.0
      frozen_foods: 1.0
      personal_care: 1.0
      household_supplies: 1.0
      condiments_seasonings: 1.0

    # Override default duplicate rules for specific subcategories (optional)
    # If not specified, uses simulation.yaml defaults
    # subcategory_allow_duplicates:
    #   grains: false
    #   rice: false

    # price_sensitivity:
    #   max_multiplier: 1.15
    
    # Equal weight across all days
    transaction_weight:
      monday: 10
      tuesday: 10
      wednesday: 10
      thursday: 10
      friday: 10
      saturday: 10
      sunday: 10


  # Price-sensitive, smaller baskets
  budget_tier:

    # User demographic
    base_user: 25

    # Defines chance of new users everyday being created in this tier. Basic formula: chance per day * days in month
    daily_retry: 4
    daily_new_user_chance: 0.1
    daily_new_user_chance_weekend: 0.18

    daily_new_user_noise:
      distribution: poisson
      multiplier: 1.15
    
    # Defines new users multiplier by month name. E.g., january: 1.2 means 20% more new users in January. This is before the noise is applied.
    monthly_new_user_multiplier:
      january: 1.0
      february: 1.0
      march: 1.0
      april: 1.0
      may: 1.0
      june: 1.0
      july: 1.0
      august: 1.0
      september: 1.0
      october: 1.0
      november: 1.0
      december: 1.0

    monthly_new_user_noise:
      distribution: poisson
      multiplier: 1.25
    
    # Minimum and maximum items per transaction
    basket:
      min_items: 1
      max_items: 4

    # Relative preference for each category (higher = more likely)
    category_weight:
      vegetables: 1.2
      fruits: 0.6
      grains: 1.1
      dairy: 0.5
      bakery: 0.3
      snacks: 0.4
      beverages: 0.2
      meat: 0.1
      seafood: 0.1
      poultry: 1.0
      frozen_foods: 0.7
      personal_care: 0.1
      household_supplies: 0.3
      condiments_seasonings: 0.4
    
    # Average units per item (Poisson distribution)
    quantity_model:
      base_lambda: 1.5
    
    # Multiplier for quantity per category: actual_avg = base_lambda * bias
    # E.g., vegetables: 1.5 * 1.2 = 1.8 avg units per item
    quantity_bias:
      vegetables: 1.3
      fruits: 0.5
      grains: 0.1
      dairy: 0.5
      bakery: 0.3
      snacks: 0.4
      beverages: 0.2
      meat: 0.1
      seafood: 0.1
      poultry: 1.2
      frozen_foods: 0.7
      personal_care: 0.1
      household_supplies: 0.3
      condiments_seasonings: 0.4

    # Override default duplicate rules for specific subcategories (optional)
    # If not specified, uses simulation.yaml defaults
    # subcategory_allow_duplicates:
    #   grains: false
    #   rice: false

    # price_sensitivity:
    #   max_multiplier: 1.05
    
    # Likelihood of this tier being selected per weekday (higher = more likely)
    transaction_weight:
      monday: 10
      tuesday: 10
      wednesday: 10
      thursday: 10
      friday: 10
      saturday: 10
      sunday: 10

