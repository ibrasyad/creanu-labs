# Template tier - copy this file and rename to create new customer segments
# Replace "template" with your tier name and customize the values

template:
  # User demographic
  base_user: 10

  # Defines chance of new users everyday being created in this tier. Each retry is an independent chance.
  daily_retry: 1
  daily_new_user_chance: 0.05
  daily_new_user_chance_weekend: 0.10

  daily_new_user_noise:
    distribution: poisson
    multiplier: 1.15
  
  # Defines new users multiplier by month name
  monthly_new_user_multiplier:
    january: 1.0
    february: 1.0
    march: 1.0
    april: 1.0
    may: 1.0
    june: 1.0
    july: 1.0
    august: 1.0
    september: 1.0
    october: 1.0
    november: 1.0
    december: 1.0

  monthly_new_user_noise:
    distribution: poisson
    multiplier: 1.25
  
  # Minimum and maximum items per transaction
  basket:
    min_items: 1
    max_items: 4

  # Relative preference for each category (higher = more likely)
  category_weight:
    vegetables: 1.0
    fruits: 1.0
    grains: 1.0
    dairy: 1.0
    bakery: 1.0
    snacks: 1.0
    beverages: 1.0
    meat: 1.0
    seafood: 1.0
    poultry: 1.0
    frozen_foods: 1.0
    personal_care: 1.0
    household_supplies: 1.0
    condiments_seasonings: 1.0
  
  # Average units per item (Poisson distribution)
  quantity_model:
    base_lambda: 1.5
  
  # Multiplier for quantity per category: actual_avg = base_lambda * bias
  quantity_bias:
    vegetables: 1.0
    fruits: 1.0
    grains: 1.0
    dairy: 1.0
    bakery: 1.0
    snacks: 1.0
    beverages: 1.0
    meat: 1.0
    seafood: 1.0
    poultry: 1.0
    frozen_foods: 1.0
    personal_care: 1.0
    household_supplies: 1.0
    condiments_seasonings: 1.0
  
  # Likelihood of this tier being selected per weekday
  transaction_weight:
    monday: 10
    tuesday: 10
    wednesday: 10
    thursday: 10
    friday: 10
    saturday: 10
    sunday: 10
