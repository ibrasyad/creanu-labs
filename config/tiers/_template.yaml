# =============================================================================
# CUSTOMER TIER TEMPLATE
# =============================================================================
# Copy this file and rename to create new customer segments
# Replace "template" with your tier name and customize the values
# =============================================================================

template:
  # ==================== TIER METADATA ====================
  profile:     conservative
  description: "Budget-conscious students seeking affordable convenience"

  # ==================== VISIT PATTERNS ====================
  
  # Daily visit probability by weekday
  visit_chance:
    monday:    0.03   # 3% - low weekday activity
    tuesday:   0.03   # 3% - study focus
    wednesday: 0.03   # 3% - mid-week
    thursday:  0.03   # 3% - near weekend
    friday:    0.05   # 5% - pre-weekend
    saturday:  0.08   # 8% - weekend shopping
    sunday:    0.09   # 9% - highest weekend

  # Monthly visit multipliers (academic calendar impact)
  monthly_visit_chance_multiplier:
    january:   0.6   # Winter break - low activity
    february:  0.7   # Back to school
    march:     0.8   # Mid-semester
    april:     0.7   # Exam period
    may:       0.75  # End of semester
    june:      0.8   # Summer session
    july:      0.9   # Summer break
    august:    1.2   # Back to school prep
    september: 1.3   # Fall semester start
    october:   1.1   # Settled in
    november:  0.9   # Pre-exam
    december:  0.7   # Final exams
  
  # ==================== CONVERSION FUNNEL ====================
  
  # Landing page - Quick browsing, low commitment
  landing_page:
    conversion_rate: 0.30   # 30% proceed (selective)
    duration:
      min_duration: 5
      max_duration: 1800    # 30 minutes max
      avg_duration: 150    # ~2.5 minutes

  # Product view - Price-sensitive browsing
  product_view:
    conversion_rate: 0.40   # 40% add to cart
    duration:
      min_duration: 5
      max_duration: 3600    # 1 hour max
      avg_duration: 400    # ~7 minutes

  # Add to cart - Cautious consideration
  add_to_cart:
    conversion_rate: 0.45   # 45% proceed to checkout
    duration:
      min_duration: 5
      max_duration: 900     # 15 minutes max
      avg_duration: 300    # 5 minutes

  # Checkout - Budget review
  checkout:
    conversion_rate: 0.60   # 80% complete purchase
    duration:
      min_duration: 5
      max_duration: 86400   # 24 hours max
      avg_duration: 1500   # 25 minutes

  # Paid - Transaction completed
  paid:
    conversion_rate: 1.0    # 100% (final stage)
    duration:
      min_duration: 0
      max_duration: 0
      avg_duration: 0

  # Random variation in funnel performance
  funnel_noise:
    distribution: poisson
    multiplier: 1.15
  
  # ==================== VISIT TIMING ====================
  
  # Peak visit hours (student schedule)
  visit_hour_peak:
    first:                     # Morning (between classes)
      weight: 3
      hour:
        min: 0
        max: 23
        avg: 11               # 11 AM average
        
    second:                    # Afternoon (after classes)
      weight: 8
      hour:
        min: 0
        max: 23
        avg: 16               # 4 PM average
        
    third:                     # Evening (study break)
      weight: 18
      hour:
        min: 0
        max: 23
        avg: 21               # 9 PM average

  # ==================== USER ACQUISITION ====================
 
  # Initial user count for this tier
  base_user: 10

  # Number of attempts per day to create new users in this tier
  daily_retry: 1
  
  # Probability of creating a new user on each attempt
  daily_new_user_chance: 0.05       # 5% on weekdays
  daily_new_user_chance_weekend: 0.10  # 10% on weekends

  # Random variation in daily new user creation
  daily_new_user_noise:
    distribution: poisson
    multiplier: 1.15

  # Monthly multipliers for new user acquisition
  monthly_new_user_multiplier:
    january:   1.0
    february:  1.0
    march:     1.0
    april:     1.0
    may:       1.0
    june:      1.0
    july:      1.0
    august:    1.0
    september: 1.0
    october:   1.0
    november:  1.0
    december:  1.0

  # Random variation in monthly new user creation
  monthly_new_user_noise:
    distribution: poisson
    multiplier: 1.25

  # ==================== SHOPPING BEHAVIOR ====================
  
  # Basket size limits
  basket:
    min_items: 1   # Minimum items per transaction
    max_items: 4   # Maximum items per transaction

  # Category preference weights (higher = more likely to purchase)
  category_weight:
    vegetables:           1.0
    fruits:              1.0
    grains:              1.0
    dairy:               1.0
    bakery:              1.0
    snacks:              1.0
    beverages:           1.0
    meat:                1.0
    seafood:             1.0
    poultry:             1.0
    frozen_foods:        1.0
    personal_care:       1.0
    household_supplies:  1.0
    condiments_seasonings: 1.0

  # Average quantity per item (Poisson distribution)
  quantity_model:
    base_lambda: 1.5   # Expected average units per product

  # Quantity bias per category (multiplier for base_lambda)
  quantity_bias:
    vegetables:           1.0
    fruits:              1.0
    grains:              1.0
    dairy:               1.0
    bakery:              1.0
    snacks:              1.0
    beverages:           1.0
    meat:                1.0
    seafood:             1.0
    poultry:             1.0
    frozen_foods:        1.0
    personal_care:       1.0
    household_supplies:  1.0
    condiments_seasonings: 1.0

  # ==================== TRANSACTION PATTERNS ====================
  
  # Likelihood of this tier being selected for transactions by weekday
  transaction_weight:
    monday:    10
    tuesday:   10
    wednesday: 10
    thursday:  10
    friday:    10
    saturday:  10
    sunday:    10
