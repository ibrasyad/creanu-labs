# ======================================================
# STEP TEMPLATES (DO NOT TOUCH unless expert)
# ======================================================
step_templates:
  landing_page: &landing_page
    conversion_rate: 0.3
    duration: [8, 35]   # seconds

  product_view: &product_view
    conversion_rate: 0.3
    duration: [33, 615] # seconds

  add_to_cart: &add_to_cart
    conversion_rate: 0.2
    duration: [56, 239] # seconds

  checkout: &checkout
    conversion_rate: 0.7
    duration: [47, 264] # seconds

  paid: &paid
    conversion_rate: 1
    duration: [0, 0]


# ======================================================
# TIERS (SAFE FOR USERS TO EDIT)
# ======================================================
tiers:
  - id: 0
    label: "Default"
    funnel_steps:
      landing_page: *landing_page
      product_view: *product_view
      add_to_cart: *add_to_cart
      checkout: *checkout
      paid: *paid

  # ---------------------------------------
  # Tier 1 — Highest value customers
  # Bulk buyers who spend heavily each month.
  # ---------------------------------------
  - id: 1
    label: "High spenders & bulk buyers"
    funnel_steps:
      landing_page: *landing_page
      product_view: *product_view
      add_to_cart: *add_to_cart

      checkout:
        <<: *checkout
        conversion_rate: 0.85   # override only what differs

      paid: *paid
