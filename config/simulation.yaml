# =============================================================================
# GLOBAL SIMULATION DEFAULTS
# =============================================================================
# These settings can be overridden by tier-specific configurations
# =============================================================================

simulation:
  # ==================== USER BEHAVIOR ====================
  
  # Visit decay rate over time (user engagement drops without activity)
  visit_decay:
    - days: 0
      multiplier: 1.00   # Fresh users
    - days: 7
      multiplier: 0.90   # 1 week old
    - days: 14
      multiplier: 0.70   # 2 weeks old
    - days: 21
      multiplier: 0.50   # 3 weeks old
    - days: 28
      multiplier: 0.40   # 1 month old
    - days: 60
      multiplier: 0.30   # 2 months old
    - days: 90
      multiplier: 0.20   # 3 months old
    - days: 120
      multiplier: 0.10   # 4 months old
    - days: 150
      multiplier: 0.05   # 5+ months old

  # Daily visit probability by weekday
  visit_chance:
    monday:    0.05   # 5% chance
    tuesday:   0.05   # 5% chance
    wednesday: 0.05   # 5% chance
    thursday:  0.05   # 5% chance
    friday:    0.05   # 5% chance
    saturday:  0.075   # 7.5% chance (higher weekend)
    sunday:    0.075   # 7.5% chance (higher weekend)

  # ==================== SHOPPING BEHAVIOR ====================
  
  # Default basket size (if tier doesn't specify)
  basket:
    min_items: 1   # Minimum items per transaction
    max_items: 12   # Maximum items per transaction

  # Default quantity distribution (if tier doesn't specify)
  quantity_model:
    base_lambda: 1.3   # Expected avg units per product (Poisson parameter)

  # Price randomization around base prices
  price_variation:
    std_pct: 0.08   # 8% standard deviation for normal distribution

  # ==================== SUBCATEGORY DUPLICATE CONTROL ====================
  # Controls whether same subcategory can appear multiple times in basket
  # true = multiple items from same subcategory allowed (e.g., 2 different leafy greens)
  # false = only 1 item from that subcategory per basket (e.g., only 1 type of rice)
  
  subcategory_allow_duplicates:
    # Vegetables
    leafy_greens:      true
    root_vegetables:   true
    
    # Fruits
    citrus:            true
    berries:           true
    tropical:          true
    stone_fruits:      true
    melons:            true
    
    # Grains
    rice:              false   # Usually only one type of rice
    
    # Dairy & Eggs
    milk:              true
    cheese:            true
    yogurt:            true
    butter:            true
    eggs:              true
    
    # Bakery
    bread:             true
    pastries:          true
    cakes:             false
    cookies:           true
    muffins:           true
    
    # Snacks
    chips:             true
    nuts:              true
    granola_bars:      true
    popcorn:           true
    dried_fruits:      true
    
    # Beverages
    soda:              true
    juice:             true
    water:             true
    coffee:            true
    tea:               true
    
    # Meat & Seafood
    beef:              true
    lamb:              true
    fish:              true
    shrimp:            true
    tuna:              true
    
    # Poultry
    whole_chicken:     false   # Usually only one whole chicken
    chicken_parts:     true
    
    # Frozen Foods
    frozen_vegetables:  true
    frozen_meals:      true
    
    # Personal Care
    skincare:          true
    haircare:          true
    oral_care:         true
    
    # Household Supplies
    cleaning_products: true
    paper_goods:       true
    
    # Condiments & Seasonings
    sauces:            true
    spices:            true
    oils:              false   # Usually only one type of cooking oil
    dressings:         true
    marinades:         true
    
    # Ready to Eat
    instant_noodles_cup:   true
    instant_noodles_pack:  true
    
    # Pantry
    pasta:             true
    rice_vermicelli:   true
    flour:             true
    sugar:             true
    salt:              true
    
    # Breakfast
    cereals:           true
    oatmeal:           true
    
    # Health
    supplements:        true
    vitamins:          true
    
    # Processed Foods
    canned_goods:      true
    packaged_meals:    true