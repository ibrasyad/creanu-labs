# Global simulation defaults (can be overridden by tier-specific settings)
simulation:
  # Decay rate
  visit_decay:
    - days: 0
      multiplier: 1
    - days: 7
      multiplier: 0.8
    - days: 14
      multiplier: 0.6
    - days: 21
      multiplier: 0.5
    - days: 28
      multiplier: 0.4
    - days: 60
      multiplier: 0.3
    - days: 90
      multiplier: 0.2
    - days: 120
      multiplier: 0.1
    - days: 150
      multiplier: 0.05

  # Funnel
  visit_chance:
    monday: 0.05
    tuesday: 0.05
    wednesday: 0.05
    thursday: 0.05
    friday: 0.05
    saturday: 0.08
    sunday: 0.08

  # Default basket size (used if tier doesn't specify)
  basket:
    min_items: 1
    max_items: 8

  # Default quantity distribution (used if tier doesn't specify)
  quantity_model:
    # Expected avg units per product (Poisson parameter)
    base_lambda: 1.3

  # Price randomization around base_price
  price_variation:
    # 8% standard deviation for normal distribution
    std_pct: 0.08

  # Per-subcategory duplicate control: can same subcategory appear multiple times in basket?
  # true = multiple items from same subcategory allowed (e.g., 2 different leafy greens)
  # false = only 1 item from that subcategory per basket (e.g., only 1 type of rice)
  subcategory_allow_duplicates:
    # vegetables: 
    leafy_greens: true
    root_vegetables: true
    # fruits: 
    citrus: true
    berries: true
    tropical: true
    stone_fruits: true
    melons: true
    # grains: 
    rice: false
    # dairy: 
    milk: true
    cheese: true
    yogurt: true
    butter: true
    eggs: true
    # bakery: 
    bread: true
    pastries: true
    cakes: true
    cookies: true
    muffins: true
    # snacks: 
    chips: true
    nuts: true
    granola_bars: true
    popcorn: true
    dried_fruits: true
    # beverages: 
    soda: true
    juice: true
    water: true
    coffee: true
    tea: true
    # meat: 
    beef: true
    lamb: true
    # seafood: 
    fish: true
    # poultry: 
    whole_chicken: false
    chicken_parts: true
    # frozen_foods: 
    frozen_vegetables: true
    frozen_meals: true
    # personal_care: 
    skincare: true
    haircare: true
    oral_care: true
    # household_supplies: 
    cleaning_products: true
    paper_goods: true
    # condiments_seasonings: 
    sauces: true
    spices: true
    oils: false
    dressings: true
    marinades: true