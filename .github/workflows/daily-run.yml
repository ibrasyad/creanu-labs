name: Daily Data Generation

on:
  schedule:
    # Run daily at 23:00 UTC (which is 06:00 UTC+7 next day)
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD, defaults to current UTC+7)'
        required: false
        type: string

jobs:
  generate-daily-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        
    - name: Check if Parquet files exist, if not download from repository
      run: |
        if [ ! -f "output/transaction.parquet" ]; then
          echo "No Parquet files found, downloading from repository..."
          mkdir -p output
          # Use current branch instead of main
          BRANCH="${GITHUB_REF#refs/heads/}"
          if [ "$BRANCH" = "" ]; then
            BRANCH="main"
          fi
          echo "Downloading from branch: $BRANCH"
          
          curl -o output/catalog.parquet https://raw.githubusercontent.com/ibrasyad/lettuce-melon/$BRANCH/output/catalog.parquet
          curl -o output/users_base.parquet https://raw.githubusercontent.com/ibrasyad/lettuce-melon/$BRANCH/output/users_base.parquet
          curl -o output/users_updated.parquet https://raw.githubusercontent.com/ibrasyad/lettuce-melon/$BRANCH/output/users_updated.parquet
          curl -o output/transaction.parquet https://raw.githubusercontent.com/ibrasyad/lettuce-melon/$BRANCH/output/transaction.parquet
          curl -o output/transaction_item.parquet https://raw.githubusercontent.com/ibrasyad/lettuce-melon/$BRANCH/output/transaction_item.parquet
          curl -o output/funnel.parquet https://raw.githubusercontent.com/ibrasyad/lettuce-melon/$BRANCH/output/funnel.parquet
        fi
        
    - name: Validate Parquet files are not empty
      run: |
        for file in output/*.parquet; do
          if [ -f "$file" ]; then
            SIZE=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null || echo "0")
            if [ "$SIZE" -lt 100 ]; then
              echo "Warning: $file appears to be empty ($SIZE bytes), removing..."
              rm "$file"
            fi
          fi
        done
        
    - name: Generate daily data
      run: |
        if [ -n "${{ github.event.inputs.date }}" ]; then
          # For specific date
          echo "Running for specific date: ${{ github.event.inputs.date }}"
          python -c "import sys; sys.path.append('.'); from generate import main; main(start_date='${{ github.event.inputs.date }}', end_date='${{ github.event.inputs.date }}')"
        else
          # Daily run - generate for yesterday (UTC+7)
          # When running at 23:00 UTC, it's 06:00 UTC+7 next day
          # So yesterday UTC+7 is the current UTC date
          YESTERDAY_UTC7=$(date +%Y-%m-%d)
          echo "Running daily generation for UTC+7 yesterday: $YESTERDAY_UTC7"
          python -c "import sys; sys.path.append('.'); from generate import main; main(start_date='$YESTERDAY_UTC7', end_date='$YESTERDAY_UTC7')"
        fi
        
    - name: Upload updated Parquet files
      uses: actions/upload-artifact@v4
      with:
        name: lettuce-melon-parquet
        path: output/*.parquet
        retention-days: 30
        overwrite: true
        
    - name: Commit and push updates
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add output/*.parquet
        git diff --staged --quiet || git commit -m "Daily data update ($(date +'%Y-%m-%d'))"
        git push
    
    - name: Create/update tag for release
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git tag -f daily-data
        git push -f origin daily-data
    
    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
    
    - name: Update GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: "Daily Data"
        tag_name: "daily-data"
        files: output/*.parquet
        body: |
          Last updated: ${{ steps.date.outputs.date }}
          
          ## Files
          - catalog.parquet
          - users_base.parquet  
          - users_updated.parquet
          - transaction.parquet
          - transaction_item.parquet
          - funnel.parquet
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
