name: Daily Data Generation

on:
  schedule:
    # Run daily at 00:30 UTC (which is 07:30 UTC+7)
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD, defaults to current UTC+7)'
        required: false
        type: string

jobs:
  generate-daily-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        
    - name: Download existing CSV files
      uses: actions/download-artifact@v4
      with:
        name: lettuce-melon-csv
        path: output/
      continue-on-error: true
        
    - name: Check if CSV files exist, if not download from repository
      run: |
        if [ ! -f "output/transaction.csv" ]; then
          echo "No CSV artifacts found, downloading from repository..."
          mkdir -p output
          curl -o output/catalog.csv https://raw.githubusercontent.com/ibrasyad/lettuce-melon/main/output/catalog.csv
          curl -o output/users_updated.csv https://raw.githubusercontent.com/ibrasyad/lettuce-melon/main/output/users_updated.csv
          curl -o output/transaction.csv https://raw.githubusercontent.com/ibrasyad/lettuce-melon/main/output/transaction.csv
          curl -o output/transaction_item.csv https://raw.githubusercontent.com/ibrasyad/lettuce-melon/main/output/transaction_item.csv
          curl -o output/funnel.csv https://raw.githubusercontent.com/ibrasyad/lettuce-melon/main/output/funnel.csv
        fi
        
    - name: Generate daily data
      run: |
        if [ -n "${{ github.event.inputs.date }}" ]; then
          # For specific date, we need to modify the config temporarily
          echo "Running for specific date: ${{ github.event.inputs.date }}"
          # Note: generate.py uses config dates, so this will generate for config range
          python generate.py
        else
          # Daily run - generate for current date range
          echo "Running daily generation"
          python generate.py
        fi
        
    # CSV files are already generated by generate.py
        
    - name: Upload updated CSV files
      uses: actions/upload-artifact@v4
      with:
        name: lettuce-melon-csv
        path: output/*.csv
        retention-days: 30
        overwrite: true
        
    - name: Commit and push updates
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add output/*.csv
        git diff --staged --quiet || git commit -m "Daily data update ($(date +'%Y-%m-%d'))"
        git push
