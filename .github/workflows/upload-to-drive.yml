name: Upload to Google Drive

on:
  workflow_call:
    inputs:
      folder_id:
        description: 'Google Drive folder ID'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      folder_id:
        description: 'Google Drive folder ID'
        required: false
        type: string

jobs:
  upload-to-drive:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib
        
    - name: Download existing Parquet files
      uses: actions/download-artifact@v4
      with:
        name: lettuce-melon-parquet
        path: output/
      continue-on-error: true
        
    - name: Check if Parquet files exist, if not download from repository
      run: |
        if [ ! -f "output/transaction.parquet" ]; then
          echo "No Parquet artifacts found, downloading from repository..."
          mkdir -p output
          curl -o output/catalog.parquet https://raw.githubusercontent.com/ibrasyad/lettuce-melon/main/output/catalog.parquet
          curl -o output/users_updated.parquet https://raw.githubusercontent.com/ibrasyad/lettuce-melon/main/output/users_updated.parquet
          curl -o output/transaction.parquet https://raw.githubusercontent.com/ibrasyad/lettuce-melon/main/output/transaction.parquet
          curl -o output/transaction_item.parquet https://raw.githubusercontent.com/ibrasyad/lettuce-melon/main/output/transaction_item.parquet
          curl -o output/funnel.parquet https://raw.githubusercontent.com/ibrasyad/lettuce-melon/main/output/funnel.parquet
        fi
        
    - name: Upload to Google Drive
      env:
        GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        DRIVE_FOLDER_ID: ${{ github.event.inputs.folder_id || secrets.DRIVE_FOLDER_ID }}
      run: |
        # Create service account file from secret
        echo "$GOOGLE_SERVICE_ACCOUNT" > service_account.json
        
        # Set environment variable for the script
        export GOOGLE_SERVICE_ACCOUNT_PATH="./service_account.json"
        
        # Run upload script
        if [ -n "$DRIVE_FOLDER_ID" ]; then
          python upload_to_drive.py --folder-id "$DRIVE_FOLDER_ID"
        else
          echo "No Drive folder ID provided, skipping upload"
        fi
        
        # Clean up service account file
        rm -f service_account.json
