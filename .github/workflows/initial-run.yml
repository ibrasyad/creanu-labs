name: Initial Data Generation

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: false
        default: '2023-01-01'
        type: string
      end_date:
        description: 'End date (YYYY-MM-DD)'
        required: false
        default: '2025-12-31'
        type: string

jobs:
  generate-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        
    - name: Generate initial data
      run: |
        python generate.py
        
    - name: Upload Parquet files
      uses: actions/upload-artifact@v4
      with:
        name: lettuce-melon-parquet
        path: output/*.parquet
        retention-days: 30
        
    - name: Commit and push data files
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add output/*.parquet
        git diff --staged --quiet || git commit -m "Generate initial data (${{ github.event.inputs.start_date || '2023-01-01' }} to ${{ github.event.inputs.end_date || '2025-12-31' }})"
        git push
        
    - name: Upload to Google Drive
      uses: ./.github/workflows/upload-to-drive.yml
      with:
        folder_id: ${{ secrets.DRIVE_FOLDER_ID }}
