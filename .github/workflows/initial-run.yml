name: Initial Data Generation

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: false
        default: '2023-01-01'
        type: string
      end_date:
        description: 'End date (YYYY-MM-DD)'
        required: false
        default: '2025-12-31'
        type: string

jobs:
  generate-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        
    - name: Generate initial data
      run: |
        python generate.py --start-date "${{ github.event.inputs.start_date || '2023-01-01' }}" --end-date "${{ github.event.inputs.end_date || '2025-12-31' }}"
        
    - name: Upload Parquet files
      uses: actions/upload-artifact@v4
      with:
        name: lettuce-melon-parquet
        path: output/*.parquet
        retention-days: 30
        
    - name: Commit and push data files
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add output/*.parquet
        git diff --staged --quiet || git commit -m "Generate initial data (${{ github.event.inputs.start_date || '2023-01-01' }} to ${{ github.event.inputs.end_date || '2025-12-31' }})"
        
        # Retry push up to 3 times with exponential backoff
        for i in {1..3}; do
          if git push; then
            echo "Push successful on attempt $i"
            break
          else
            echo "Push failed on attempt $i"
            if [ $i -eq 3 ]; then
              echo "All push attempts failed"
              exit 1
            fi
            echo "Retrying in $((10 * i)) seconds..."
            sleep $((10 * i))
          fi
        done
