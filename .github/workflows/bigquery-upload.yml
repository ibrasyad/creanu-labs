name: Daily BigQuery Upload

on:
  schedule:
    # Run daily at 00:00 UTC (1 hour after daily-run.yml at 23:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Target date (YYYY-MM-DD, defaults to current UTC+7)'
        required: false
        type: string

jobs:
  upload-to-bigquery:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pandas google-cloud-bigquery google-auth pyarrow
        
    - name: Upload to BigQuery
      env:
        GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        BIGQUERY_PROJECT_ID: ${{ secrets.BIGQUERY_PROJECT_ID }}
        BIGQUERY_DATASET_ID: ${{ secrets.BIGQUERY_DATASET_ID }}
        TARGET_TABLE_NAME: ${{ secrets.TARGET_TABLE_NAME }}
        OUTPUT_DIR: "output"
      run: |
        echo "Starting BigQuery upload..."
        python bigquery.py
        
    - name: Upload results as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bigquery-upload-logs
        path: |
          *.log
        retention-days: 7
        overwrite: true
